name: CalcInk checks
on:
  push:
    branches: [main, final]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: node tests/registry/check-registry.mjs
      - name: Build current source once for both tester systems
        env:
          CALCINK_VERIFIED_BUILD: ${{ runner.temp }}/calcink-verified-build.json
        run: node scripts/testing/verified-build.mjs build "$CALCINK_VERIFIED_BUILD"
      - name: ML Implementation Tester (available deterministic and real-model gates)
        env:
          CALCINK_VERIFIED_BUILD: ${{ runner.temp }}/calcink-verified-build.json
        run: npm run test:ml
      - name: Product Interaction / Feature Tester (baseline and required V2 workflows)
        if: always()
        env:
          CALCINK_PRODUCT_REQUIRED: '1'
          CALCINK_VERIFIED_BUILD: ${{ runner.temp }}/calcink-verified-build.json
        run: npm run test:product
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tester-reports-and-browser-evidence
          path: test-results
